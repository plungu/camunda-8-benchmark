apiVersion: apps/v1
kind: Deployment
metadata:
  name: camunda-8-benchmark
  labels:
    app: camunda-8-benchmark
spec:
  selector:
    matchLabels:
      app: camunda-8-benchmark
  replicas: 5
  template:
    metadata:
      labels:
        app: camunda-8-benchmark
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8088"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: camunda-8-benchmark
          image: gcr.io/paul-rnd/paul-camunda-8-benchmark:0.0.1-SNAPSHOT
          imagePullPolicy: Always
          env:
            - name: JAVA_OPTIONS
              value: >-                
                -Dasync.corePoolSize=40
                -Dasync.maxPoolSize=300
                -Dasync.queueCapacity=2000
                -Dscheduler.poolSize=60
                -Dzeebe.client.broker.gateway-address=camunda-zeebe-gateway:26500
                -Dzeebe.client.security.plaintext=true
                -Dzeebe.client.worker.max-jobs-active=2000
                -Dzeebe.client.worker.threads=500
                -Dzeebe.client.default-job-worker-stream-enabled=true
                -Dbenchmark.startPiPerSecond=50
                -Dbenchmark.taskCompletionDelay=10
                -Dbenchmark.multipleJobTypes=0
                -Denchmark.warmupPhaseDurationMillis=6000
                -Dbenchmark.startRateAdjustmentStrategy=backpressure
                -Dbenchmark.maxBackpressurePercentage=10.0
                -Dbenchmark.startPiReduceFactor=0.1
                -Dbenchmark.startPiIncreaseFactor=0.5
                -Dbenchmark.fixedBackOffDelay=0
                -Dbenchmark.bpmnProcessId=benchmark
                -Dbenchmark.startProcesses=true         
                -Dbenchmark.startWorkers=true
                -Dbenchmark.jobType=benchmark-task
                -Dbenchmark.payloadPath=classpath:bpmn/typical_payload.json
                -Dbenchmark.autoDeployProcess=false
                -Dbenchmark.bpmnResource=classpath:bpmn/complex_decision.dmn
                -Dbenchmark.bpmnResource=classpath:bpmn/simple_dmn_process.bpmn
          resources:
            limits:
              cpu: 8
              memory: 20Gi
            requests:
              cpu: 8
              memory: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: camunda-8-benchmark

spec:
  selector:
    app: camunda-8-benchmark
  ports:
    - port: 8088
      targetPort: 8088